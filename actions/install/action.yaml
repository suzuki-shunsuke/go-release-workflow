name: build
description: build
inputs:
  aqua_version:
    description: aqua version
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: echo "AQUA_GLOBAL_CONFIG=${GITHUB_ACTION_PATH}/aqua/aqua.yaml" >> "$GITHUB_ENV"
    - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
      with:
        aqua_version: ${{inputs.aqua_version}}
        aqua_opts: -l -a

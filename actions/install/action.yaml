name: build
description: build
inputs:
  aqua_version:
    description: aqua version
    required: true
  packages:
    description: command and package names to be installed
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: cp -Rf "${GITHUB_ACTION_PATH}/aqua" "$GITHUB_WORKSPACE/../.aqua"
    - uses: aquaproj/aqua-installer@b8be739961814ee66b9e0d505f4d5de0d2eff047 # v4.1.2
      with:
        aqua_version: ${{inputs.aqua_version}}
        packages: ${{inputs.packages}}

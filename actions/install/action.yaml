name: build
description: build
inputs:
  aqua_version:
    description: aqua version
    required: true
  packages:
    description: command and package names to be installed
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: cp -Rf "${GITHUB_ACTION_PATH}/aqua" "$GITHUB_WORKSPACE/../.aqua"
    - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: ${{inputs.aqua_version}}
        packages: ${{inputs.packages}}

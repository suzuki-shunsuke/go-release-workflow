---
name: Release Go
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false
    inputs:
      aqua_version:
        required: true
        type: string
      aqua_policy_allow:
        required: false
        type: string
      aqua_policy_config:
        required: false
        type: string
      go-version:
        required: false
        type: string
      go-version-file:
        required: false
        type: string
      go-cache:
        # Deprecated: This input is ignored.
        # Go modules are passed via an artifact and the cache of actions/setup-go is always disabled.
        required: false
        type: boolean
        default: false
      go_licenses_package:
        required: false
        type: string
      packslip:
        # Publish a signed packslip.sigstore.json so mise and other packslip clients can install the release.
        # https://packslip.dev/
        required: false
        type: boolean
        default: false
      packslip_bin:
        # The executable inside each archive. The default is the repository name.
        required: false
        type: string
      split_build:
        # Compile each target in parallel jobs to warm up Go's build cache before the build job runs GoReleaser.
        # This speeds up the release of large applications.
        required: false
        type: boolean
        default: false
      split_build_targets:
        # A JSON array of targets compiled in parallel when split_build is true.
        # Each target is <GOOS>_<GOARCH>.
        # A target missing from this list is still built by GoReleaser, just without the warmed up cache.
        required: false
        type: string
        default: '["linux_amd64", "linux_arm64", "darwin_amd64", "darwin_arm64", "windows_amd64", "windows_arm64"]'

permissions: {}

env:
  AQUA_POLICY_CONFIG: ${{ inputs.aqua_policy_config }}
  AQUA_LOG_COLOR: always

jobs:
  gomodule:
    # Download Go modules through Takumi Guard, which requires id-token: write.
    # The build job runs code controlled by the caller (e.g. GoReleaser hooks),
    # so it must not have id-token: write.
    # Go modules and go-licenses are passed to the build job via an artifact.
    uses: suzuki-shunsuke/download-go-module-action/.github/workflows/download.yaml@e03acd0c9d3d230019ebb7bd4a62507431fe4316 # v0.0.10
    permissions:
      contents: read
      id-token: write
    with:
      go-version-file: ${{inputs.go-version-file || 'go.mod'}}
      aqua_version: ${{inputs.aqua_version}}
      aqua_packages: go-licenses
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  build-cache:
    # Compile each target in parallel and pass Go's build cache to the build job.
    # The build job still builds every target with GoReleaser, so this job only makes it faster.
    if: inputs.split_build
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: gomodule
    permissions:
      contents: read
    env:
      GOPROXY: "off"
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.split_build_targets) }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{inputs.go-version}}
          go-version-file: ${{inputs.go-version-file}}
          cache: false

      - name: Restore Go modules and go-licenses
        uses: suzuki-shunsuke/download-go-module-action/restore@e03acd0c9d3d230019ebb7bd4a62507431fe4316 # v0.0.10
        with:
          aqua_version: ${{inputs.aqua_version}}

      - name: Install goreleaser
        uses: $/actions/install
        with:
          aqua_version: ${{inputs.aqua_version}}
          packages: goreleaser

      - name: Remove changes
        run: git checkout -- .

      - name: Build the target with GoReleaser
        id: build
        # The build job builds the target again, so a failure here only makes the build job slower.
        continue-on-error: true
        # Build with the same configuration as the build job so that the compile results are reused.
        # The version only affects the linker flags, so a snapshot build is enough.
        run: |
          GOOS=${TARGET%%_*} GOARCH=${TARGET#*_} goreleaser build --single-target --snapshot --clean
        env:
          TARGET: ${{ matrix.target }}

      - name: Archive Go's build cache
        if: steps.build.outcome == 'success'
        run: tar -C "$(go env GOCACHE)" -cf - . | zstd -T0 -3 -q -o "$RUNNER_TEMP/gocache.tar.zst"

      - name: Upload Go's build cache
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gocache-${{ matrix.target }}
          path: ${{ runner.temp }}/gocache.tar.zst
          compression-level: 0 # Already compressed by zstd
          retention-days: 1

  build:
    # build-cache is skipped unless inputs.split_build is true.
    if: ${{ !cancelled() && !failure() }}
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: [gomodule, build-cache]
    permissions:
      contents: read
    env:
      # Use only the modules downloaded in the gomodule job.
      # Fail instead of silently downloading modules without Takumi Guard.
      GOPROXY: "off"
    steps:
      - name: Validate inputs go-version and go-version-file
        if: inputs.go-version == '' && inputs.go-version-file == ''
        run: |
          echo "::error:: Either go-version or go-version-file must be set."
          exit 1

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{inputs.go-version}}
          go-version-file: ${{inputs.go-version-file}}
          cache: false

      - name: Restore Go modules and go-licenses
        uses: suzuki-shunsuke/download-go-module-action/restore@e03acd0c9d3d230019ebb7bd4a62507431fe4316 # v0.0.10
        with:
          aqua_version: ${{inputs.aqua_version}}

      - name: Download Go's build cache
        if: inputs.split_build
        # Without the build cache, GoReleaser just builds from scratch.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gocache-*
          path: ${{ runner.temp }}/gocache

      - name: Restore Go's build cache
        if: inputs.split_build
        continue-on-error: true
        run: |
          gocache=$(go env GOCACHE)
          mkdir -p "$gocache"
          find "$RUNNER_TEMP/gocache" -name gocache.tar.zst | while read -r f; do
            zstd -dc "$f" | tar -xf - -C "$gocache"
          done

      - name: Install goreleaser and syft
        uses: $/actions/install
        with:
          aqua_version: ${{inputs.aqua_version}}
          packages: |
            goreleaser
            syft

      - name: Remove changes
        # Sometimes it is failed to release by goreleaser due to changes of go.sum
        run: git checkout -- .

      - name: Fetch tags to release
        run: git fetch --tags -f

      - name: Unshallow
        run: git fetch --prune --unshallow

      - name: Save Go's library licenses
        run: go-licenses save "$PACKAGE" --save_path third_party_licenses
        env:
          PACKAGE: ${{ inputs.go_licenses_package && inputs.go_licenses_package || format('./cmd/{0}', github.event.repository.name) }}

      - name: Create Go's license directory
        run: mkdir -p third_party_licenses/go

      - name: Download Go's license
        run: |
          version=$(go env GOVERSION)
          curl -Lq -o third_party_licenses/go/LICENSE --retry 5 "https://raw.githubusercontent.com/golang/go/refs/tags/go${version#go}/LICENSE"

      - name: Run GoReleaser without creating a release
        run: goreleaser release --skip publish --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload GoReleaser artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.txt
            dist/*.sbom.json
            dist/*.jsonl

      - name: Upload checksum files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksum
          path: |
            dist/*.txt

      - name: Upload Goreleaser artifacts (Homebrew, Scoop, Winget)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goreleaser
          path: |
            dist/homebrew
            dist/scoop
            dist/winget

  cosign:
    # Run even if build-cache is skipped.
    if: ${{ !cancelled() && !failure() }}
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    needs: [build]
    permissions:
      id-token: write # required for cosign
    env:
      # Don't checkout the repository in this job because it has id-token: write.
      # The aqua policy file of the caller doesn't exist in this job and isn't needed to install cosign.
      AQUA_POLICY_CONFIG: ""
    steps:
      - name: Install Cosign
        uses: $/actions/install
        with:
          aqua_version: ${{inputs.aqua_version}}
          packages: cosign

      - name: Download checksum files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksum
          path: dist

      - name: Sign checksum files with Cosign
        run: |
          checksum=$(find dist -name "*checksums.txt")

          cosign sign-blob "$checksum" \
            -y \
            --bundle "${checksum}.sigstore.json"

      - name: Upload signed checksum files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cosign
          path: |
            dist/*.sigstore.json

  attestation:
    if: ${{ !cancelled() && !failure() }}
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    needs: [cosign]
    permissions:
      id-token: write # required for GitHub Artifact Attestations
      attestations: write # required for GitHub Artifact Attestations
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Download cosign artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cosign
          path: dist

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.txt
            dist/*.sigstore.json
            dist/*.sbom.json

  packslip:
    # Sign the packslip in a job without contents: write.
    # The release job uploads the bundle with the other assets.
    if: ${{ inputs.packslip && !cancelled() && !failure() }}
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    # The attestation job attests the archives, and the packslip links those attestations.
    needs: [attestation]
    permissions:
      contents: read
      id-token: write # required to sign the packslip
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create and sign the packslip
        uses: jdx/packslip@ddcddd9c8c33977d2d08d5db91caec579da59aab # v1.11.0
        with:
          artifacts: |
            dist/*.tar.gz
            dist/*.zip
          bin: ${{ inputs.packslip_bin && inputs.packslip_bin || github.event.repository.name }}
          attest: link # The attestation job already attested the archives.
          upload: false
          out: packslip

      - name: Upload the packslip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip
          path: packslip/*.sigstore.json

  release:
    # packslip is skipped unless inputs.packslip is true.
    if: ${{ !cancelled() && !failure() }}
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    needs: [cosign, packslip]
    permissions:
      contents: write # required to create a release
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Download cosign artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cosign
          path: dist

      - name: Download the packslip
        if: inputs.packslip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packslip
          path: dist

      - name: List dist directory
        run: ls dist

      - name: Create a GitHub release and upload artifacts
        run: gh release create -R "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" -p dist/*
        env:
          GH_TOKEN: ${{ github.token }}

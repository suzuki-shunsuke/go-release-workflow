---
name: Release Go
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false
    inputs:
      aqua_version:
        required: true
        type: string
      aqua_policy_allow:
        required: false
        type: string
      aqua_policy_config:
        required: false
        type: string
      go-version:
        required: false
        type: string
      go-version-file:
        required: false
        type: string
      go-cache:
        # Restoring a cache in a release job risks cache poisoning, so it's disabled by default.
        required: false
        type: boolean
        default: false
      go_licenses_package:
        required: false
        type: string

permissions: {}

env:
  AQUA_POLICY_CONFIG: ${{ inputs.aqua_policy_config }}
  AQUA_LOG_COLOR: always

jobs:
  gomodule:
    # Download Go modules through Takumi Guard, which requires id-token: write.
    # The build job runs code controlled by the caller (e.g. GoReleaser hooks),
    # so it must not have id-token: write.
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate inputs go-version and go-version-file
        if: inputs.go-version == '' && inputs.go-version-file == ''
        run: |
          echo "::error:: Either go-version or go-version-file must be set."
          exit 1

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Takumi Guard
        uses: flatt-security/setup-takumi-guard-golang@2e3c7c40b538cd68b2ac483def12982ebc8bc02e # v1
        with:
          bot-id: ${{secrets.TAKUMI_GUARD_BOT_ID}}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{inputs.go-version}}
          go-version-file: ${{inputs.go-version-file}}
          cache: ${{inputs.go-cache}}

      - name: Install go-licenses
        uses: $/actions/install
        with:
          aqua_version: ${{inputs.aqua_version}}
          packages: go-licenses

      - name: Download Go modules
        run: go mod download all

      - name: Archive Go modules and go_install packages (go-licenses)
        run: |
          mkdir -p "$RUNNER_TEMP/gomodule"
          tar -C "$(go env GOMODCACHE)" -czf "$RUNNER_TEMP/gomodule/gomodcache.tar.gz" cache/download
          tar -C "$(aqua root-dir)" -czf "$RUNNER_TEMP/gomodule/go_install.tar.gz" pkgs/go_install

      # Pass the modules and binaries via an artifact instead of actions/cache.
      # Artifacts are scoped to this workflow run, so they can't be poisoned by other workflows.
      # Files are archived with tar because artifacts don't preserve file permissions.
      - name: Upload Go modules and go_install packages (go-licenses)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gomodule
          path: ${{ runner.temp }}/gomodule
          retention-days: 1

  build:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: gomodule
    permissions:
      contents: read
    env:
      # Use only the modules downloaded in the gomodule job.
      # Fail instead of silently downloading modules without Takumi Guard.
      GOPROXY: "off"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{inputs.go-version}}
          go-version-file: ${{inputs.go-version-file}}
          cache: false

      - name: Download Go modules and go_install packages (go-licenses)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gomodule
          path: ${{ runner.temp }}/gomodule

      - name: Extract Go modules
        run: |
          gomodcache=$(go env GOMODCACHE)
          mkdir -p "$gomodcache"
          tar -C "$gomodcache" -xzf "$RUNNER_TEMP/gomodule/gomodcache.tar.gz"

      - name: Install goreleaser and syft
        uses: $/actions/install
        with:
          aqua_version: ${{inputs.aqua_version}}
          packages: |
            goreleaser
            syft

      - name: Extract go_install packages (go-licenses)
        run: |
          root_dir=$(aqua root-dir)
          mkdir -p "$root_dir"
          tar -C "$root_dir" -xzf "$RUNNER_TEMP/gomodule/go_install.tar.gz"

      - name: Remove changes
        # Sometimes it is failed to release by goreleaser due to changes of go.sum
        run: git checkout -- .

      - name: Fetch tags to release
        run: git fetch --tags -f

      - name: Unshallow
        run: git fetch --prune --unshallow

      - name: Save Go's library licenses
        run: go-licenses save "$PACKAGE" --save_path third_party_licenses
        env:
          PACKAGE: ${{ inputs.go_licenses_package && inputs.go_licenses_package || format('./cmd/{0}', github.event.repository.name) }}

      - name: Create Go's license directory
        run: mkdir -p third_party_licenses/go

      - name: Download Go's license
        run: |
          version=$(go env GOVERSION)
          curl -Lq -o third_party_licenses/go/LICENSE --retry 5 "https://raw.githubusercontent.com/golang/go/refs/tags/go${version#go}/LICENSE"

      - name: Run GoReleaser without creating a release
        run: goreleaser release --skip publish --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload GoReleaser artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.txt
            dist/*.sbom.json
            dist/*.jsonl

      - name: Upload checksum files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksum
          path: |
            dist/*.txt

      - name: Upload Goreleaser artifacts (Homebrew, Scoop, Winget)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreleaser
          path: |
            dist/homebrew
            dist/scoop
            dist/winget

  cosign:
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    needs: [build]
    permissions:
      id-token: write # required for cosign
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: $/actions/install
        with:
          aqua_version: ${{inputs.aqua_version}}
          packages: cosign

      - name: Download checksum files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksum
          path: dist

      - name: Sign checksum files with Cosign
        run: |
          checksum=$(find dist -name "*checksums.txt")

          cosign sign-blob "$checksum" \
            -y \
            --bundle "${checksum}.sigstore.json" \
            --oidc-provider github

      - name: Upload signed checksum files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosign
          path: |
            dist/*.sigstore.json

  attestation:
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    needs: [cosign]
    permissions:
      id-token: write # required for GitHub Artifact Attestations
      attestations: write # required for GitHub Artifact Attestations
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Download cosign artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cosign
          path: dist

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.txt
            dist/*.sigstore.json
            dist/*.sbom.json

  release:
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    needs: [cosign]
    permissions:
      contents: write # required to create a release
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Download cosign artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cosign
          path: dist

      - name: List dist directory
        run: ls dist

      - name: Create a GitHub release and upload artifacts
        run: gh release create -R "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" -p dist/*
        env:
          GH_TOKEN: ${{ github.token }}

---
name: Release Go
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false
    inputs:
      aqua_version:
        required: true
        type: string
      aqua_policy_allow:
        required: false
        type: string
      aqua_policy_config:
        required: false
        type: string
      go-version:
        required: false
        type: string
      go-version-file:
        required: false
        type: string
      go-cache:
        # Restoring a cache in a release job risks cache poisoning, so it's disabled by default.
        required: false
        type: boolean
        default: false
      go_licenses_package:
        required: false
        type: string

permissions: {}

env:
  AQUA_POLICY_CONFIG: ${{ inputs.aqua_policy_config }}
  AQUA_LOG_COLOR: always

jobs:
  gomodule:
    # Download Go modules through Takumi Guard, which requires id-token: write.
    # The build job runs code controlled by the caller (e.g. GoReleaser hooks),
    # so it must not have id-token: write.
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - run: |
          echo "::error:: Either go-version or go-version-file must be set."
          exit 1
        if: inputs.go-version == '' && inputs.go-version-file == ''
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/actions/install
        with:
          aqua_version: ${{inputs.aqua_version}}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{inputs.go-version}}
          go-version-file: ${{inputs.go-version-file}}
          cache: ${{inputs.go-cache}}

      - uses: flatt-security/setup-takumi-guard-golang@2e3c7c40b538cd68b2ac483def12982ebc8bc02e # v1
        with:
          bot-id: ${{secrets.TAKUMI_GUARD_BOT_ID}}
      - run: go mod download all
      # go-licenses is installed by `go install`, which can't run with GOPROXY=off in the build job.
      # So build it here and pass the binary to the build job.
      - run: go-licenses --help
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: |
          mkdir -p "$RUNNER_TEMP/gomodule"
          tar -C "$(go env GOMODCACHE)" -czf "$RUNNER_TEMP/gomodule/gomodcache.tar.gz" cache/download
          tar -C "$(aqua root-dir)" -czf "$RUNNER_TEMP/gomodule/go_install.tar.gz" pkgs/go_install
      # Pass the modules and binaries via an artifact instead of actions/cache.
      # Artifacts are scoped to this workflow run, so they can't be poisoned by other workflows.
      # Files are archived with tar because artifacts don't preserve file permissions.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gomodule
          path: ${{ runner.temp }}/gomodule
          retention-days: 1

  build:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: gomodule
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    permissions:
      contents: read
    env:
      # Use only the modules downloaded in the gomodule job.
      # Fail instead of silently downloading modules without Takumi Guard.
      GOPROXY: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{inputs.go-version}}
          go-version-file: ${{inputs.go-version-file}}
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gomodule
          path: ${{ runner.temp }}/gomodule
      - run: |
          gomodcache=$(go env GOMODCACHE)
          mkdir -p "$gomodcache"
          tar -C "$gomodcache" -xzf "$RUNNER_TEMP/gomodule/gomodcache.tar.gz"

      - uses: $/actions/install
        with:
          aqua_version: ${{inputs.aqua_version}}
      - run: |
          root_dir=$(aqua root-dir)
          mkdir -p "$root_dir"
          tar -C "$root_dir" -xzf "$RUNNER_TEMP/gomodule/go_install.tar.gz"

      - name: remove changes
        # Sometimes it is failed to release by goreleaser due to changes of go.sum
        run: git checkout -- .
      - name: fetch tags to release
        run: git fetch --tags -f
      - name: Unshallow
        run: git fetch --prune --unshallow
      - run: goreleaser -v
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}
      - run: go-licenses --help
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}
      - run: go-licenses save "$PACKAGE" --save_path third_party_licenses
        env:
          PACKAGE: ${{ inputs.go_licenses_package && inputs.go_licenses_package || format('./cmd/{0}', github.event.repository.name) }}
      - run: mkdir -p third_party_licenses/go
      - run: |
          version=$(go env GOVERSION)
          curl -Lq -o third_party_licenses/go/LICENSE --retry 5 "https://raw.githubusercontent.com/golang/go/refs/tags/go${version#go}/LICENSE"

      - run: syft --version
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}
      # GoReleaser runs syft with only a few environment variables such as PATH and HOME.
      # AQUA_GLOBAL_CONFIG isn't passed, so aqua's proxy can't find syft.
      # Add the directory of the syft binary itself to PATH.
      - run: dirname "$(aqua which syft)" >> "$GITHUB_PATH"

      - name: Run GoReleaser
        run: goreleaser release --skip publish --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.txt
            dist/*.sbom.json
            dist/*.jsonl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksum
          path: |
            dist/*.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreleaser
          path: |
            dist/homebrew
            dist/scoop
            dist/winget

      - name: Generate hashes
        id: hash
        run: |
          # sha256sum generates sha256 hash for all artifacts.
          # base64 -w0 encodes to base64 and outputs on a single line.
          # sha256sum artifact1 artifact2 ... | base64 -w0
          echo "hashes=$( (find dist -name "*.tar.gz" && find dist -name "*.zip") | xargs sha256sum | base64 -w0)" >> "$GITHUB_OUTPUT"

  cosign:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      id-token: write # required for cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/actions/install
        with:
          aqua_version: ${{inputs.aqua_version}}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksum
          path: dist
      - run: cosign version
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}
      - run: |
          checksum=$(find dist -name "*checksums.txt")

          cosign sign-blob "$checksum" \
            -y \
            --bundle "${checksum}.sigstore.json" \
            --oidc-provider github

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosign
          path: |
            dist/*.sigstore.json

  attestation:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    needs: [cosign]
    permissions:
      id-token: write # required for GitHub Artifact Attestations
      attestations: write # required for GitHub Artifact Attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cosign
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.txt
            dist/*.sigstore.json
            dist/*.sbom.json

  release:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    needs: [cosign]
    permissions:
      contents: write # required to create a release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cosign
          path: dist

      - run: ls dist
      - run: gh release create -R "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" -p dist/*
        env:
          GH_TOKEN: ${{ github.token }}

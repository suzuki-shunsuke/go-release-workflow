---
permissions: {}
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false
jobs:
  test:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@0b89b9b4314282810bc944364380568708208eaa # v0.0.2
    with:
      aqua_version: v2.65.2
    permissions:
      pull-requests: read
      contents: read

  test-release:
    uses: $/.github/workflows/release.yaml
    with:
      aqua_version: v2.65.2
      go-version-file: go.mod
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      contents: write
      id-token: write
      attestations: write
